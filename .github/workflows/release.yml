name: Release Obsidian theme

# Merging into master releases automatically: the version is bumped here, so nobody
# has to remember to do it. Pushing a tag by hand still works for manual releases.
on:
  push:
    branches: [master]
    tags: ["*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply before releasing
        type: choice
        options: [patch, minor, major]
        default: patch

# Needed to push the version commit + tag and to create the release
permissions:
  contents: write

# One release at a time, so two merges in quick succession cannot race on a version
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The bot's own "chore(release):" commit must not trigger another bump, and a merge
    # can opt out by putting "[skip release]" in its commit message.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message || '', 'chore(release):') &&
      !contains(github.event.head_commit.message || '', '[skip release]'))
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Bump version
        if: github.ref_type == 'branch'
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "master" ]; then
            echo "::error::Version bumps run on master only (current ref: $GITHUB_REF_NAME)."
            exit 1
          fi
          node version-bump.mjs "$BUMP"

      - name: Commit version and push tag
        if: github.ref_type == 'branch'
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json manifest.json versions.json
          if git diff --cached --quiet; then
            echo "No version change to commit."
          else
            git commit -m "chore(release): $version"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists, leaving it as is."
          else
            git tag "$version"
            git push origin "refs/tags/$version"
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          manifest_version="$(node -p "require('./manifest.json').version")"
          version="$manifest_version"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
            # Obsidian identifies a release by its tag, so a mismatch would ship the wrong manifest
            if [ "$manifest_version" != "$version" ]; then
              echo "::error::Tag $version does not match manifest.json version $manifest_version."
              exit 1
            fi
          fi

          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists, nothing to do."
            exit 0
          fi

          gh release create "$version" \
            --title "$version" \
            --generate-notes \
            --draft \
            manifest.json theme.css
